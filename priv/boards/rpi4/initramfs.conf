# cryptinit config, lands at /etc/initramfs.conf inside the CPIO.
#
# dm-verity is mandatory and needs nothing here: the root hash comes from the
# signed cmdline (verity_roothash=, injected by nerves_sign) and the hash-tree
# offset is derived from the rootfs filesystem size.
#
# Encryption is opt-in by presence. For an encrypted rootfs keyed from RPi OTP,
# uncomment the lines below and ship the matching helper at /usr/sbin/unlock
# (the default helper, or your own via config :nerves_sign, key_helper_source).
#
# rootfs_key = cmd:/usr/sbin/unlock
#
# Cipher: the library default is aes-xts-plain64. Devices already provisioned
# with another scheme must keep theirs (e.g. aes-cbc-plain). The exact string
# must match BOTH the offline rootfs encryption in your fwup.conf AND the
# kernel's enabled crypto (CRYPTO_XTS=y for xts, CRYPTO_CBC=y for cbc).
# Leave unset to use the default; set it to pin an existing scheme:
#
# rootfs_cipher = aes-xts-plain64
#
# For an encrypted data partition set up after switch_root:
# data_device = /dev/mmcblk0p3
# data_key    = cmd:/usr/sbin/unlock data
# data_cipher = aes-xts-plain64
