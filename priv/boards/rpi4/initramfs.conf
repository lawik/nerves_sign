# cryptinit config, lands at /etc/initramfs.conf inside the initramfs CPIO.
#
# This file is ONLY about encryption. dm-verity needs nothing from it: the root
# hash arrives on the signed kernel cmdline (verity_roothash=, injected by
# nerves_sign) and the hash tree offset is derived from the rootfs superblock.
# cryptinit treats a missing file as "no encryption", which is what
# `mix nerves_sign.gen.rpi4 --no-encryption` gives you.
#
# The key comes from the RPi customer OTP rows, read by the helper nerves_sign
# builds into the initramfs at /usr/sbin/unlock. Point at your own with
# `config :nerves_sign, key_helper_source: "priv/secure_boot/unlock.c"`.
# unlock reads an existing key and fails on an unprovisioned device.
rootfs_key = cmd:/usr/sbin/unlock

# For a device that provisions itself on first boot — generate a key, burn it
# into the customer OTP rows, convert the plaintext rootfs in place — use the
# bootstrap helper instead, passing the rootfs partition and a same-sized
# staging partition (the spare A/B rootfs slot):
#
# rootfs_key = cmd:/usr/sbin/bootstrap-or-derive /dev/mmcblk0p2 /dev/mmcblk0p3
#
# It prints the same key either way, so cryptinit never learns which happened.

# The cipher string is passed straight to the dm-crypt table, and it must match
# in THREE places or the device will not mount:
#
#   1. here, at runtime
#   2. the offline rootfs encryption in your fwup.conf
#   3. the kernel (CRYPTO_XTS=y for xts, CRYPTO_CBC=y for cbc)
#
# aes-xts-plain64 is cryptinit's default and the right choice for new devices.
# Devices already provisioned with another scheme must keep theirs, e.g.
# aes-cbc-plain — that is a fact about your fleet, so it lives here in your
# project rather than anywhere in nerves_sign.
rootfs_cipher = aes-xts-plain64

# How long to wait for block devices to appear before giving up.
# device_timeout = 10

# A separate encrypted data partition, set up after switch_root:
# data_device = /dev/mmcblk0p3
# data_key    = cmd:/usr/sbin/your-helper
# data_cipher = aes-xts-plain64
#
# Note: the shipped unlock helper takes no arguments and always returns the
# same OTP-derived key, so pointing data_key at it would encrypt both volumes
# with one key. Ship your own helper (key_helper_source) if you want distinct
# keys per volume — deriving them from the OTP secret with HKDF, for instance.
