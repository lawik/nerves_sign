# Outer firmware fwup config for RPi4/CM4 secure boot.
#
# The boot partition holds only the signed boot.img + boot.sig and the outer
# config.txt/cmdline.txt the firmware reads to load it. The kernel, initramfs,
# dtbs and inner txts all live inside boot.img (built + signed by nerves_sign's
# post-processing). The rootfs (squashfs + appended dm-verity hash tree) goes to
# the rootfs partition.
#
# nerves_sign produces these in ${NERVES_SYSTEM}/images during post-processing:
#   boot.img, boot.sig, outer_config.txt, outer_cmdline.txt

require-fwup-version="0.15.0"

include("${NERVES_APP}/config/rpi4/fwup_include/fwup-common.conf")

file-resource boot.img { host-path = "${NERVES_SYSTEM}/images/boot.img" }
file-resource boot.sig { host-path = "${NERVES_SYSTEM}/images/boot.sig" }
file-resource config.txt { host-path = "${NERVES_SYSTEM}/images/outer_config.txt" }
file-resource cmdline.txt { host-path = "${NERVES_SYSTEM}/images/outer_cmdline.txt" }

file-resource rootfs.img {
    host-path = ${ROOTFS}
    assert-size-lte = ${ROOTFS_A_PART_COUNT}
}

mbr mbr-a {
    partition 0 { block-offset = ${BOOT_A_PART_OFFSET} block-count = ${BOOT_A_PART_COUNT} type = 0xc boot = true }
    partition 1 { block-offset = ${ROOTFS_A_PART_OFFSET} block-count = ${ROOTFS_A_PART_COUNT} type = 0x83 }
    partition 2 { block-offset = ${APP_PART_OFFSET} block-count = ${APP_PART_COUNT} type = 0x83 expand = true }
}

mbr mbr-b {
    partition 0 { block-offset = ${BOOT_B_PART_OFFSET} block-count = ${BOOT_B_PART_COUNT} type = 0xc boot = true }
    partition 1 { block-offset = ${ROOTFS_B_PART_OFFSET} block-count = ${ROOTFS_B_PART_COUNT} type = 0x83 }
    partition 2 { block-offset = ${APP_PART_OFFSET} block-count = ${APP_PART_COUNT} type = 0x83 expand = true }
}

uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

task complete {
    require-unmounted-destination = true
    on-init {
        mbr_write(mbr-a)
        fat_mkfs(${BOOT_A_PART_OFFSET}, ${BOOT_A_PART_COUNT})
        fat_setlabel(${BOOT_A_PART_OFFSET}, "BOOT-A")
        uboot_clearenv(uboot-env)
        include("${NERVES_PROVISIONING}")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_devpath", ${NERVES_FW_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")
    }
    on-resource boot.img { fat_write(${BOOT_A_PART_OFFSET}, "boot.img") }
    on-resource boot.sig { fat_write(${BOOT_A_PART_OFFSET}, "boot.sig") }
    on-resource config.txt { fat_write(${BOOT_A_PART_OFFSET}, "config.txt") }
    on-resource cmdline.txt { fat_write(${BOOT_A_PART_OFFSET}, "cmdline.txt") }
    on-resource rootfs.img { raw_write(${ROOTFS_A_PART_OFFSET}) }
    on-finish {
        raw_memset(${BOOT_B_PART_OFFSET}, 256, 0xff)
        raw_memset(${ROOTFS_B_PART_OFFSET}, 256, 0xff)
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}

task upgrade.a {
    require-partition-offset(1, ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    on-init {
        fat_mkfs(${BOOT_A_PART_OFFSET}, ${BOOT_A_PART_COUNT})
        fat_setlabel(${BOOT_A_PART_OFFSET}, "BOOT-A")
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})
    }
    on-resource boot.img { fat_write(${BOOT_A_PART_OFFSET}, "boot.img") }
    on-resource boot.sig { fat_write(${BOOT_A_PART_OFFSET}, "boot.sig") }
    on-resource config.txt { fat_write(${BOOT_A_PART_OFFSET}, "config.txt") }
    on-resource cmdline.txt { fat_write(${BOOT_A_PART_OFFSET}, "cmdline.txt") }
    on-resource rootfs.img { raw_write(${ROOTFS_A_PART_OFFSET}) }
    on-finish {
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        mbr_write(mbr-a)
    }
}

task upgrade.b {
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    on-init {
        fat_mkfs(${BOOT_B_PART_OFFSET}, ${BOOT_B_PART_COUNT})
        fat_setlabel(${BOOT_B_PART_OFFSET}, "BOOT-B")
        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})
    }
    on-resource boot.img { fat_write(${BOOT_B_PART_OFFSET}, "boot.img") }
    on-resource boot.sig { fat_write(${BOOT_B_PART_OFFSET}, "boot.sig") }
    on-resource config.txt { fat_write(${BOOT_B_PART_OFFSET}, "config.txt") }
    on-resource cmdline.txt { fat_write(${BOOT_B_PART_OFFSET}, "cmdline.txt") }
    on-resource rootfs.img { raw_write(${ROOTFS_B_PART_OFFSET}) }
    on-finish {
        uboot_setenv(uboot-env, "b.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "b.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "b.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "b.nerves_fw_uuid", "\${FWUP_META_UUID}")
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        mbr_write(mbr-b)
    }
}

task upgrade.unexpected {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    on-init { error("Could not determine active partition (A or B).") }
}

task provision {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    on-init { include("${NERVES_PROVISIONING}") }
}
